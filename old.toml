
[project]
name = "voiceflow-tts"
version = "0.1.0"
description = "VoiceFlow: Efficient Text-to-Sound with Rectified Flow Matching"
readme = "README.md"
requires-python = ">=3.10,<3.11"

dependencies = [
  "numpy>=1.26.4",
  "scipy>=1.13.1",
  "numba>=0.60.0",
  "soundfile>=0.12.1",
  "librosa>=0.10.2",
  "kaldiio>=2.18.0",
  "pooch>=1.8.2",
  "torch>=2.9.0",
  "torchsde>=0.2.6",
  "torchcde>=0.2.5",
  "pytorch-lightning>=2.3.3",
  "tensorboard>=2.17.1",
  "tqdm>=4.66.5",
  "pyyaml>=6.0.2",
  "einops>=0.8.0",
  "scikit-learn>=1.5.2",
  "joblib>=1.4.2",
  "matplotlib>=3.9.2",
  "Pillow>=10.4.0",
  "packaging>=24.1",
  "filelock>=3.16.1",
  "attrs>=24.2.0",
  "h5py>=3.11.0",
  "Cython>=3.0.11",
  "decorator>=5.1.1",
  "POT>=0.9.4",
  "setuptools>=73.0.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceflow_tts"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
